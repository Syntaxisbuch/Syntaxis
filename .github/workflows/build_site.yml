name: Syntaxis Site Builder

# Wann soll der Generator laufen?
on:
  push:
    branches:
      - main
    # EXTREM WICHTIG: Das Skript läuft NUR, wenn Dateien in diesen Ordnern geändert wurden.
    paths:
      - 'data/**'
      - '_build/**'
      - 'assets/**'
  workflow_dispatch: # Erlaubt manuelles Starten

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Der Bot braucht Schreibrechte für das Repository
    permissions:
      contents: write

    steps:
      - name: 1. Syntaxis-Repository auschecken
        uses: actions/checkout@v4

      - name: 2. Python 3 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Seiten-Generator (build.py) ausführen
        # Hier rufen wir exakt dein Skript auf
        run: python3 _build/build.py

      - name: 4. Generierte Dateien committen und pushen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-Build: Seiten, Sitemap und robots.txt aus aktuellen Daten generiert"
          branch: main
          # build.py schreibt inzwischen auch sitemap.xml, robots.txt und die
          # Umleitungsseiten unter Syntaxis/ aus SITE_URL — alle drei müssen hier
          # mit erfasst werden, sonst committet der Bot nur die HTML-Seiten am
          # Wurzelverzeichnis und der Rest friert auf dem zuletzt von Hand
          # gepushten Stand ein.
          file_pattern: "*.html sitemap.xml robots.txt Syntaxis/*.html"
