<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTAXIS | Meister-Autopsien der Schatten</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand"><span class="brand-logo"></span><span>SYNTAXIS</span></a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Hub</a>
                <a href="landkarte.html" class="nav-link">Landkarte</a>
                <a href="autopsien.html" class="nav-link active">Autopsien</a>
                <a href="romane.html" class="nav-link">Chroniken</a>
                <a href="ueber-das-projekt.html" class="nav-link">Über das Projekt</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <div class="badge-tag">Forensischer Katalog (CC BY-NC-SA 4.0)</div>
            <h1>Meister-Autopsien der Schatten</h1>
            <p class="lead">105 sektionierte Zerrbilder, Pseudomedizinen und Mythen in 10 geschlossenen Sektionen.</p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">Alle Sektionen</button>
            <button class="filter-btn" data-filter="A">Sektion A: Kosmos (#01–#10) </button>
            <button class="filter-btn" data-filter="B">Sektion B: Körper (#11–#22)</button>
            <button class="filter-btn" data-filter="C">Sektion C: Verborgene Hand (#23–#35)</button>
        </div>

        <div class="grid-3" id="autopsien-render-target">
            <!-- Wird via app.js gerendert -->
        </div>
    </main>

    <aside class="audio-bar">
        <div class="audio-info">
            <span class="audio-pulse"></span>
            <div class="audio-labels">
                <span class="track-title" id="player-track-title">Soundscape</span>
                <span class="track-meta" id="player-track-meta">CC BY 4.0</span>
            </div>
        </div>
        <div class="audio-controls">
            <button class="audio-btn" id="audio-prev"></button>
            <button class="audio-btn btn-play" id="audio-toggle"></button>
            <button class="audio-btn" id="audio-next"></button>
            <div class="audio-progress-container">
                <div class="audio-progress-fill" id="audio-progress"></div>
            </div>
            <span class="audio-time" id="audio-time-display">00:00</span>
        </div>
        <audio id="syntaxis-stream" preload="metadata"></audio>
    </aside>

    <script src="app.js"></script>
</body>
</html>
